name: Build EDITH VISION FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y unzip wget libffi-dev libssl-dev libbz2-dev zlib1g-dev libncurses5-dev libsqlite3-dev libreadline-dev liblzma-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Install Android SDK + All Licenses
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platforms;android-34" "platform-tools" "ndk;25.1.8937393"
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROIDSDK=$HOME/android-sdk
          export ANDROIDNDK=$HOME/android-sdk/ndk/25.1.8937393
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: EDITH-VISION-FINAL-APK
          path: bin/*.apk
