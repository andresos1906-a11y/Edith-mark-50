name: AURA DEFINITIVO
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33

      - name: FIX TOTAL - NDK + SDK + Licencias + sdkmanager viejo
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          
          # 1. NDK r28c a mano (fix 404)
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -O ndk.zip
          unzip -q ndk.zip

          # 2. SDK cmdline-tools a mano
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || mv cmdline-tools/*/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          
          # 3. Crear la carpeta VIEJA que busca Buildozer y ponerle un symlink
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          
          # 4. Licencias
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b044" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "y" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 5. Instalar lo que pide el Aidl
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" || true
          
          echo "TODO INSTALADO"

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: bin/*.apk
