name: Build EDITH VISION FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libtool libffi-dev libssl-dev libasound2-dev libpulse-dev autoconf automake pkg-config libncurses5-dev unzip wget
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Accept Licenses in BOTH locations
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;25.1.8937393"
          
          # Licencias donde BUILDOZER las busca de verdad
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $HOME/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c4501b4f66f04" >> $HOME/android-sdk/licenses/android-sdk-license
          cp $HOME/android-sdk/licenses/android-sdk-license $HOME/.buildozer/android/platform/android-sdk/licenses/

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROIDNDK=$HOME/android-sdk/ndk/25.1.8937393
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21
          buildozer android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDITH-VISION-FINAL-APK
          path: bin/*.apk
